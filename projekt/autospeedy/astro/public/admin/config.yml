# Pflege-Editor für Auto Speedy (Decap CMS). Ändert nur Inhaltsfelder; Gestaltung und Seiten bleiben beim Studio.
# Jede Änderung ist ein Commit im Repository des Betriebs; der Hoster baut danach neu.
backend:
  name: github
  repo: BETRIEB/autospeedy-website   # Lücke: Repository des Betriebs, nach Übergabe eintragen
  branch: main
  commit_messages:
    update: "Pflege: {{collection}} «{{slug}}» geändert"
local_backend: true            # nur für den Test am eigenen Rechner (npx decap-server)
locale: de
media_folder: public/bilder/uploads
public_folder: /bilder/uploads

collections:
  - name: pflege
    label: Öffnungszeiten und Hinweise
    editor: { preview: false }
    files:
      - name: pflege
        label: Öffnungszeiten, Ausnahmen, Saison-Hinweis
        file: src/content/pflege.json
        format: json
        fields:
          - name: hinweis
            label: Saison-Hinweis (Band oben auf jeder Seite)
            widget: object
            collapsed: false
            fields:
              - { name: aktiv, label: "Anzeigen", widget: boolean, default: false }
              - { name: text, label: "Text (kurz, ohne Ausrufezeichen)", widget: string, pattern: ['^[^!]{3,90}$', "3 bis 90 Zeichen, ohne Ausrufezeichen"] }
              - name: link
                label: Wohin führt der Hinweis?
                widget: select
                options:
                  - { label: "Schaden melden: Hagel", value: "/schaden-melden/?art=hagel" }
                  - { label: "Schaden melden: allgemein", value: "/schaden-melden/" }
                  - { label: "Kontakt und Öffnungszeiten", value: "/kontakt/" }
                  - { label: "Tesla", value: "/tesla/" }
                  - { label: "Occasionen", value: "/occasionen/" }
          - name: zeiten
            label: Öffnungszeiten
            label_singular: Tagesgruppe
            widget: list
            summary: "{{fields.tage}}"
            fields:
              - { name: tage, label: "Tage (ausgeschrieben)", widget: string, hint: "z. B. Montag bis Donnerstag" }
              - { name: kurz, label: "Tage (kurz, für die erste Zeile der Startseite)", widget: string, hint: "z. B. Mo bis Do" }
              - name: wochentage
                label: Welche Wochentage?
                widget: select
                multiple: true
                options:
                  - { label: Montag, value: Monday }
                  - { label: Dienstag, value: Tuesday }
                  - { label: Mittwoch, value: Wednesday }
                  - { label: Donnerstag, value: Thursday }
                  - { label: Freitag, value: Friday }
                  - { label: Samstag, value: Saturday }
                  - { label: Sonntag, value: Sunday }
              - { name: geschlossen, label: "Geschlossen", widget: boolean, default: false }
              - name: fenster
                label: Offen von bis
                widget: list
                required: false
                summary: "{{fields.von}} bis {{fields.bis}}"
                fields:
                  - { name: von, label: "von (z. B. 7.30)", widget: string, pattern: ['^([01]?\d|2[0-3])\.[0-5]\d$', "Format 7.30"] }
                  - { name: bis, label: "bis (z. B. 12.00)", widget: string, pattern: ['^([01]?\d|2[0-3])\.[0-5]\d$', "Format 12.00"] }
          - name: ausnahmen
            label: Feiertage und Betriebsferien
            label_singular: Ausnahme
            widget: list
            required: false
            summary: "{{fields.datum}} · {{fields.name}}"
            fields:
              - { name: name, label: "Bezeichnung", widget: string, hint: "z. B. Weihnachten, Betriebsferien" }
              - { name: datum, label: "Datum", widget: datetime, date_format: "DD.MM.YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { name: geschlossen, label: "Ganzer Tag geschlossen", widget: boolean, default: true }
              - { name: von, label: "sonst offen von", widget: string, required: false }
              - { name: bis, label: "bis", widget: string, required: false }
  - name: team
    label: Team
    editor: { preview: false }
    files:
      - name: team
        label: Team und Rollen
        file: src/content/team.json
        format: json
        fields:
          - name: gruppen
            label: Bereiche
            label_singular: Bereich
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Bereich", widget: string }
              - name: leute
                label: Personen (nur mit Einverständnis)
                label_singular: Person
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string }
                  - { name: rolle, label: "Rolle", widget: string }
